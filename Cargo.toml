[package]
name = "discord-we"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"

[profile.release]
lto = "thin"
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "http", "model", "cache", "builder", "rustls_backend"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
